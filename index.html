<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Masooma ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="hearts"></div>

  <header class="hero">
    <h1>Happy Birthday Masooma ❤️</h1>
    <p class="subtitle">Even miles apart, my heart is always with you</p>
    <button id="musicBtn">🎵 Play Our Song</button>
  </header>

  <!-- Gallery -->
  <section class="gallery">
    <img src="https://raw.githubusercontent.com/aowny93/masoomabirthdaywishes/main/1.jpeg" alt="Banner 1">
    <img src="https://raw.githubusercontent.com/aowny93/masoomabirthdaywishes/main/2.jpeg" alt="Banner 2">
    <img src="https://raw.githubusercontent.com/aowny93/masoomabirthdaywishes/main/3.jpeg" alt="Banner 3">
    <img src="https://raw.githubusercontent.com/aowny93/masoomabirthdaywishes/main/4.jpeg" alt="Banner 4">
    <img src="https://raw.githubusercontent.com/aowny93/masoomabirthdaywishes/main/5.jpeg" alt="Banner 5">
  </section>

  <!-- Wishes Section -->
  <section class="wishes">
    <div class="wish-container">
      <!-- This div will display scrolling wishes -->
      <div id="wishText" class="wish">
        <!-- First wish will appear here via JavaScript -->
      </div>
    </div>
  </section>

  <footer>
    Made with endless love by Aown ❤️
  </footer>
</div>

<!-- Background music -->
<audio id="bgMusic" src="https://raw.githubusercontent.com/aowny93/masoomabirthdaywishes/main/music.mp3" loop></audio>
<script src="script.js"></script>
</body>
</html>
